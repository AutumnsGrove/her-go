name: split_memory
agent: [memory]
description: >-
  Split a compound memory into multiple individual memories. Deactivates the
  original and creates new memories from the provided facts. Use this when a
  memory packs multiple unrelated ideas that should be stored separately.
hot: false
parameters:
  type: object
  properties:
    memory_id:
      type: integer
      description: "ID of the compound memory to split"
    new_facts:
      type: array
      items:
        type: object
        properties:
          fact:
            type: string
            description: "A single fact extracted from the compound memory."
          hook:
            type: string
            description: >-
              Single-line retrieval hint for this fact, written as a trigger
              condition rather than a restatement — see save_memory's `hook`
              parameter for the convention and worked examples.
        required:
          - fact
          - hook
      description: >-
        Individual facts extracted from the compound memory, each with its
        own hook. Each becomes its own memory.
    reason:
      type: string
      description: "Brief reason for the split"
  required:
    - memory_id
    - new_facts
    - reason
trace:
  emoji: "✂️"
  format: "#{{.memory_id}} → {{.new_facts | len}} facts"
