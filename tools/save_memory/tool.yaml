name: save_memory
agent: [memory]
hint: "save a new memory about the user"
description: >-
  Save a new memory learned from the conversation. Only for information worth
  remembering WEEKS later. Ask: 'Would this matter in a month?' If not,
  skip it. User preferences ABOUT fiction are real memories (favorite genre,
  playstyle, characters they love). In-game events are NOT (beat a boss,
  found a location). Transient moods belong in log_mood, not here.
hot: false
parameters:
  type: object
  properties:
    card_slug:
      type: string
      description: >-
        The topic card this memory belongs to. Use list_cards to see
        available slugs. Every memory MUST go in a card. If nothing
        fits, create_card first, then save_memory into it.
    memory:
      type: string
      description: >-
        A clear, single-sentence memory about {{user}}. Must pass the 'next
        month' test: would knowing this improve a conversation 30 days from
        now?
    category:
      type: string
      description: >-
        Category of the memory. Do NOT save transient moods or daily context
        as memories.
      enum:
        - identity
        - relationship
        - health
        - work
        - goal
        - event
        - preference
        - other
    tags:
      type: string
      description: >-
        Comma-separated topic tags for semantic search — describes WHAT this
        memory is about so it surfaces in the right conversations. Example:
        'mental health, burnout, coping, energy' or 'programming, go,
        backend, projects'. Be specific to the memory's topic.
    importance:
      type: integer
      description: >-
        How important is this memory? 1-10. Default 5. See the scoring
        anchors in your system prompt. When unsure, pick the lower score.
    context:
      type: string
      description: >-
        Optional 1-2 sentence note explaining WHY this memory matters or how
        it connects to other knowledge. Only include when the context isn't
        obvious from the memory itself. Example: 'Primary project language —
        she knows Python/TS but is new to Go. Teaching mode matters.'
    hook:
      type: string
      description: >-
        A single line that helps a future turn recognize this memory is
        relevant — written as a SHORT LABEL, then an em-dash, then the
        TRIGGER CONDITION for when it matters. Not a restatement of the
        memory — the memory field already has the fact. The hook's job is
        "when would I need this," not "what is this."

        Format: "<label> — <trigger condition>"

        Example 1: memory = "{{user}} told {{her}} about an inside joke:
        if a stranger ever calls her 'babe' or 'sweetheart' while she's out,
        she wants {{her}} to jokingly call her 'Donette' for the rest of the
        night, like she's a mob boss's wife."
        hook = "Donette bit — call her this when a stranger uses a pet name
        on her in public"

        Example 2: memory = "{{user}} gets migraines specifically triggered
        by fluorescent lighting combined with long stretches in meetings."
        hook = "migraine trigger — watch for this before long or
        fluorescent-lit meetings"

        The label becomes a slug automatically, so keep it short (2-5 words)
        and avoid punctuation beyond spaces.
  required:
    - card_slug
    - memory
    - category
    - tags
    - hook
trace:
  emoji: "💾"
  format: "[{{.card_slug}}] {{.memory | escape}}\n    category={{.category}}"
  on_reject:
    prefix: "rejected:"
    emoji: "🚫"
    format: "<i>{{.Result | truncate 120 | escape}}</i>"
